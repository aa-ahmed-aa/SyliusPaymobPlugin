imports:
    - { resource: 'services/*.yaml' }

services:
    Ahmedkhd\SyliusPaymobPlugin\Form\Type\GatewayConfigurationType:
        tags:
          - name: sylius.gateway_configuration_type
            type: paymob
            label: ahmedkhd_sylius_paymob_plugin.gateway.name
          - name: form.type
    
    # COMMAND PROVIDER AND ACTIONS
    ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
        arguments:
            - !tagged_locator
                tag: ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob
                index_by: 'action'
        tags:
            - name: sylius.payment_request.command_provider
              gateway_factory: !php/const Ahmedkhd\SyliusPaymobPlugin\Service\PaymobServiceInterface::GATEWAY_NAME

    ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob.capture:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandProvider\CapturePaymentRequestCommandProvider
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_CAPTURE

    ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob.status:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandProvider\StatusPaymentRequestCommandProvider
        arguments:
            - '@request_stack'
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_STATUS
    
    ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob.notify:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandProvider\NotifyPaymentRequestCommandProvider
        arguments:
            - '@request_stack'
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.command_provider.payment_request.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_NOTIFY

    ahmedkhd.sylius_paymob_plugin.command_handler.capture:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandHandler\CapturePaymentRequestHandler
        arguments:
            - '@ahmedkhd.sylius_paymob_plugin.service.paymob'
            - '@sylius.provider.payment_request'
            - '@sylius_abstraction.state_machine'
            - '@sylius.repository.payment_request'
            - '@sylius.repository.order'
            - '@sylius.repository.customer'
        tags:
            - name: messenger.message_handler

    ahmedkhd.sylius_paymob_plugin.command_handler.notify:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandHandler\NotifyPaymentRequestHandler
        arguments:
            - '@sylius.provider.payment_request'
            - '@sylius_abstraction.state_machine'
        tags:
            - name: messenger.message_handler

    ahmedkhd.sylius_paymob_plugin.command_handler.status:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandHandler\StatusPaymentRequestHandler
        arguments:
            - '@ahmedkhd.sylius_paymob_plugin.service.paymob'
            - '@sylius.provider.payment_request'
            - '@sylius_abstraction.state_machine'
        tags:
            - name: messenger.message_handler

    ahmedkhd.sylius_paymob_plugin.service.paymob:
        class: Ahmedkhd\SyliusPaymobPlugin\Service\PaymobService
        arguments:
            - '@sylius.repository.order'
            - '@sylius.repository.customer'
            - '@router'
    
    ahmedkhd.sylius_paymob_plugin.service.official_paymob:
        class: Ahmedkhd\SyliusPaymobPlugin\Service\OfficialPaymobService

    Ahmedkhd\SyliusPaymobPlugin\Controller\NotifyController:
        public: true
        arguments:
            - '@ahmedkhd.sylius_paymob_plugin.service.paymob'
            - '@router'
        tags:
            - name: controller.service_arguments
    
    ahmedkhd.sylius_paymob_plugin.provider.order_pay.http_response.paymob:
        class: Sylius\Bundle\PaymentBundle\Provider\ActionsHttpResponseProvider
        arguments:
            - !tagged_locator
                tag: ahmedkhd.sylius_paymob_plugin.provider.http_response.paymob
                index_by: action
        tags:
            - name: sylius.payment_request.provider.http_response
              gateway_factory: !php/const Ahmedkhd\SyliusPaymobPlugin\Service\PaymobServiceInterface::GATEWAY_NAME

    ahmedkhd.sylius_paymob_plugin.provider.order_pay.http_response.paymob.capture:
        class: Ahmedkhd\SyliusPaymobPlugin\ResponseProvider\CapturePaymentResponseProvider
        arguments:
            - '@router'
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.provider.http_response.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_CAPTURE
    
    ahmedkhd.sylius_paymob_plugin.provider.order_pay.http_response.paymob.status:
        class: Ahmedkhd\SyliusPaymobPlugin\ResponseProvider\StatusHttpResponseProvider
        arguments:
            - '@router'
            - '@sylius.repository.order'
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.provider.http_response.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_STATUS

    Ahmedkhd\SyliusPaymobPlugin\Provider\NotifyPaymentProvider:
        arguments:
            - '@sylius.repository.payment'
        tags:
            - name: sylius.payment_request.payment_notify_provider