imports:
    - { resource: 'services/*.yaml' }

services:
    Ahmedkhd\SyliusPaymobPlugin\Form\Type\GatewayConfigurationType:
        tags:
          - name: sylius.gateway_configuration_type
            type: paymob
            label: ahmedkhd_sylius_paymob_plugin.gateway.name
          - name: form.type
    
    ahmedkhd.sylius_paymob_plugin.command_provider.paymob:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
        arguments:
            - !tagged_locator
                tag: ahmedkhd.sylius_paymob_plugin.command_provider.paymob
                index_by: 'action'
        tags:
            - name: sylius.payment_request.command_provider
              gateway_factory: 'paymob'

    ahmedkhd.sylius_paymob_plugin.command_provider.paymob.capture:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandProvider\CapturePaymentRequestCommandProvider
        arguments: [ "@sylius.http_client" ]
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.command_provider.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_CAPTURE

    ahmedkhd.sylius_paymob_plugin.command_provider.paymob.status:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandProvider\StatusPaymentRequestCommandProvider
        tags:
            - name: ahmedkhd.sylius_paymob_plugin.command_provider.paymob
              action: !php/const Sylius\Component\Payment\Model\PaymentRequestInterface::ACTION_STATUS

    ahmedkhd.sylius_paymob_plugin.command_handler.capture:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandHandler\CapturePaymentRequestHandler
        arguments:
            - '@ahmedkhd.sylius_paymob_plugin.service.paymob'
            - '@sylius.provider.payment_request'
            - '@sylius_abstraction.state_machine'
        tags:
            - name: messenger.message_handler

    ahmedkhd.sylius_paymob_plugin.command_handler.status:
        class: Ahmedkhd\SyliusPaymobPlugin\CommandHandler\StatusPaymentRequestHandler
        arguments:
            - '@ahmedkhd.sylius_paymob_plugin.service.paymob'
            - '@sylius.provider.payment_request'
            - '@sylius_abstraction.state_machine'
        tags:
            - name: messenger.message_handler

    ahmedkhd.sylius_paymob_plugin.service.paymob:
        class: Ahmedkhd\SyliusPaymobPlugin\Service\PaymobService
        arguments:
            - '@sylius.repository.order'
            - '@sylius.repository.customer'
    