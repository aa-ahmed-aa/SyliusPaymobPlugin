services:
  # Gateway Configuration Type
  ahmedkhd.sylius_paymob_plugin.form.type.gateway_configuration.paymob:
    class: Ahmedkhd\SyliusPaymobPlugin\Form\Type\SyliusGatewayConfigurationType
    tags:
      - name: sylius.gateway_configuration_type
        type: paymob
        label: "Paymob Payment"
      - name: form.type

  # Actions Command Provider (Router)
  ahmedkhd.sylius_paymob_plugin.command_provider.paymob:
    class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
    arguments:
      - !tagged_locator
          tag: ahmedkhd.sylius_paymob_plugin.command_provider.paymob
          index_by: 'action'
    tags:
      - name: sylius.payment_request.command_provider
        gateway_factory: paymob

  # Payment Request Command Provider
  ahmedkhd.sylius_paymob_plugin.provider.payment_request.command.capture:
    class: Ahmedkhd\SyliusPaymobPlugin\Provider\CaptureCommandProvider
    tags:
      - name: ahmedkhd.sylius_paymob_plugin.command_provider.paymob
        action: capture

  # Payment Request Command Handler
  ahmedkhd.sylius_paymob_plugin.command_handler.capture:
    class: Ahmedkhd\SyliusPaymobPlugin\CommandHandler\CapturePaymentCommandHandler
    tags:
      - { name: messenger.message_handler }

  # Payment Request HTTP Response Provider
  ahmedkhd.sylius_paymob_plugin.provider.payment_request.http_response.capture:
    class: Ahmedkhd\SyliusPaymobPlugin\Provider\CaptureHttpResponseProvider
    tags:
      - name: sylius.payment_request.provider.http_response
        gateway_factory: paymob
        action: capture

  # Paymob Service
  ahmedkhd.sylius_paymob_plugin.service.paymob:
    class: Ahmedkhd\SyliusPaymobPlugin\Services\PaymobService
    public: true
    arguments:
      - '@service_container'
      - '@sylius.repository.payment'

  # Alias for PaymobServiceInterface
  Ahmedkhd\SyliusPaymobPlugin\Services\PaymobServiceInterface:
    alias: ahmedkhd.sylius_paymob_plugin.service.paymob

  # Notify Controller
  Ahmedkhd\SyliusPaymobPlugin\Controller\NotifyController:
    public: true
    autowire: true
    autoconfigure: true
